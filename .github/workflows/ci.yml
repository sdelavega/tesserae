name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components and targets;
      # rustup installs them on the first cargo invocation.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The version is pinned here and in scripts/gen-header.sh, which refuses
      # any other: cbindgen's output varies between releases. install-action
      # has no cbindgen manifest, so build it once and cache.
      - name: Cache cbindgen
        id: cbindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --version 0.29.4 --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # fuzz/ is not a workspace member, so the steps above never see it.
      - name: Format (fuzz)
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml

      - name: Clippy (fuzz)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # `pool::tests::raises_nofile_limit_and_falls_back_to_fewer_workers` is
      # `#[ignore]`d because `setrlimit` is process-wide and cargo runs a
      # binary's tests as threads in one process: un-ignored it would corrupt
      # every test beside it, and the hard limit it lowers cannot be restored.
      # So it gets a process of its own, one thread, nothing else running.
      - name: Test (descriptor limit, serialized)
        run: >
          cargo test -p tesserae-core --lib --
          --ignored --exact --test-threads=1
          pool::tests::raises_nofile_limit_and_falls_back_to_fewer_workers

      # tesserae.h is generated from tesserae-ffi and committed. Regenerate it
      # and fail on any difference, so an ABI change that does not carry its
      # header cannot merge. (abi_layout, under Test, then checks that the
      # committed header has the layout the Rust types do.)
      - name: C header is current
        run: |
          scripts/gen-header.sh
          git diff --exit-code -- crates/tesserae-ffi/include/tesserae.h

      # The static library the app links must not carry the fault-injection
      # hooks tesserae-ffi's tests turn on.
      - name: Static library has no test hooks
        run: scripts/check-shipped-lib.sh

      - name: Licences
        run: cargo deny check licenses

      # fuzz/ has its own lockfile and is not a workspace member, so the step
      # above cannot see it: a pass there says nothing about the fuzz
      # dependencies. Audit it explicitly against the same deny.toml.
      - name: Licences (fuzz)
        run: cargo deny --manifest-path fuzz/Cargo.toml check licenses

  # Short fuzz of the getattrlistbulk buffer parser. Separate from `rust` so
  # it can use nightly without disturbing the stable pin. The longer run and
  # the Miri and ASAN jobs live in nightly.yml.
  fuzz:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins stable; the fuzz scripts ask for the nightly
      # named in scripts/nightly-toolchain with an explicit `+toolchain`.
      # Minimal profile: no docs, clippy or rustfmt.
      - name: Install pinned nightly
        run: rustup toolchain install "$(cat scripts/nightly-toolchain)" --profile minimal

      # install-action has no cargo-fuzz manifest, so build it once and cache.
      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo "+$(cat scripts/nightly-toolchain)" install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz parse::entries (60 s)
        run: scripts/fuzz-parser.sh 60

      # A crash leaves its reproducer in fuzz/artifacts; keep it.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
