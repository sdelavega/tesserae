name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # rust-toolchain.toml pins the exact toolchain, its components and its
      # targets. Install them in a step of their own rather than relying on
      # rustup to do it implicitly on the first cargo invocation: with no
      # argument, `rustup toolchain install` installs the active toolchain,
      # which the file names. `rustup show` then logs what is in use.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install cargo-deny
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny

      # The version is pinned here and in scripts/gen-header.sh, which refuses
      # any other: cbindgen's output varies between releases. install-action
      # has no cbindgen manifest, so build it once and cache.
      - name: Cache cbindgen
        id: cbindgen-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --version 0.29.4 --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # fuzz/ is not a workspace member, so the steps above never see it.
      - name: Format (fuzz)
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml

      - name: Clippy (fuzz)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # `pool::tests::raises_nofile_limit_and_falls_back_to_fewer_workers` is
      # `#[ignore]`d because `setrlimit` is process-wide and cargo runs a
      # binary's tests as threads in one process: un-ignored it would corrupt
      # every test beside it, and the hard limit it lowers cannot be restored.
      # So it gets a process of its own, one thread, nothing else running.
      - name: Test (descriptor limit, serialized)
        run: >
          cargo test -p tesserae-core --lib --locked --
          --ignored --exact --test-threads=1
          pool::tests::raises_nofile_limit_and_falls_back_to_fewer_workers

      # tesserae.h is generated from tesserae-ffi and committed. Regenerate it
      # and fail on any difference, so an ABI change that does not carry its
      # header cannot merge. (abi_layout, under Test, then checks that the
      # committed header has the layout the Rust types do.)
      - name: C header is current
        run: |
          scripts/gen-header.sh
          git diff --exit-code -- crates/tesserae-ffi/include/tesserae.h

      # The static library the app links must not carry the fault-injection
      # hooks tesserae-ffi's tests turn on.
      - name: Static library has no test hooks
        run: scripts/check-shipped-lib.sh

      - name: Licences
        run: cargo deny check licenses

      # fuzz/ has its own lockfile and is not a workspace member, so the step
      # above cannot see it: a pass there says nothing about the fuzz
      # dependencies. Audit it explicitly against the same deny.toml.
      - name: Licences (fuzz)
        run: cargo deny --manifest-path fuzz/Cargo.toml check licenses

  # The Xcode project: the universal Rust library, TesseraeKit's XCTest suite
  # (which links that library: the first proof the Swift side links at all),
  # and an unsigned universal Release build of the app (spec §14).
  #
  # macos-26 (arm64) with Xcode 26.6 selected explicitly, not the image's
  # default, so a runner-image update cannot change the Xcode under the
  # project. The project is written for it: objectVersion 77 (the Xcode 16+
  # format), LastUpgradeCheck 2600, SWIFT_VERSION 6.0. Xcode 27 is only a
  # preview image (xcode-27) at the time of writing; move to it once it is GA.
  # Versions: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
  apple:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # Fail with a readable message, and the list of what the image does
      # have, if the pinned Xcode is gone (images drop old point releases).
      # Pinned deliberately rather than "newest Xcode_26.*": a silent Xcode
      # change is harder to debug than this step failing.
      - name: Pinned Xcode is installed
        run: |
          ls -d /Applications/Xcode*.app
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Xcode 26.6 ($DEVELOPER_DIR) is not on this runner image; pick one listed above and update DEVELOPER_DIR in ci.yml"
            exit 1
          fi

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Xcode in use
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      # Two release LTO builds (one per architecture) are the slow part.
      # Keyed on everything that changes what cargo fetches or which compiler
      # runs; the workspace's own crates rebuild anyway (checkout gives their
      # sources new mtimes), the dependencies do not.
      - name: Cache cargo
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: apple-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # Both Rust targets, lipo'd into apple/build/libtesserae.a. Xcode never
      # runs cargo; its Run Script phase fails the build if this is stale.
      - name: Universal Rust library
        run: just ffi

      # TesseraeKit compiles Shaders.metal. Since Xcode 26 the Metal compiler
      # is a separately downloaded component; fetch it only if a trivial
      # shader does not compile with what the image has.
      - name: Metal toolchain
        run: |
          if ! echo 'kernel void k() {}' | xcrun metal -x metal -c - -o /dev/null; then
            echo "The Metal compiler is missing from this Xcode (a separate component since Xcode 26); downloading MetalToolchain."
            xcodebuild -downloadComponent MetalToolchain
            echo 'kernel void k() {}' | xcrun metal -x metal -c - -o /dev/null
          fi

      - name: TesseraeKit tests
        run: just app-test

      - name: Unsigned universal Release build
        run: |
          just app-build
          lipo -info apple/build/DerivedData/Build/Products/Release/Tesserae.app/Contents/MacOS/Tesserae
          lipo -info apple/build/DerivedData/Build/Products/Release/Tesserae.app/Contents/Frameworks/TesseraeKit.framework/TesseraeKit

      # The .xcresult bundles (passed with -resultBundlePath by the just
      # recipes) hold the full build and test logs; open them in Xcode.
      - name: Upload Xcode results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcode-results
          path: |
            apple/build/*.xcresult
            apple/build/DerivedData/Logs
          if-no-files-found: ignore

  # Short fuzz of the getattrlistbulk buffer parser. Separate from `rust` so
  # it can use nightly without disturbing the stable pin. The longer run and
  # the Miri and ASAN jobs live in nightly.yml.
  fuzz:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # rust-toolchain.toml pins stable 1.99.1; the fuzz scripts ask for the
      # nightly named in scripts/nightly-toolchain with an explicit `+toolchain`.
      # Minimal profile: no docs, clippy or rustfmt.
      - name: Install pinned nightly
        run: rustup toolchain install "$(cat scripts/nightly-toolchain)" --profile minimal

      # install-action has no cargo-fuzz manifest, so build it once and cache.
      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo "+$(cat scripts/nightly-toolchain)" install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz parse::entries (60 s)
        run: scripts/fuzz-parser.sh 60

      # A crash leaves its reproducer in fuzz/artifacts; keep it.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
