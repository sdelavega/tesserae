name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components and targets;
      # rustup installs them on the first cargo invocation.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # fuzz/ is not a workspace member, so the steps above never see it.
      - name: Format (fuzz)
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml

      - name: Clippy (fuzz)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Licences
        run: cargo deny check licenses

      # fuzz/ has its own lockfile and is not a workspace member, so the step
      # above cannot see it: a pass there says nothing about the fuzz
      # dependencies. Audit it explicitly against the same deny.toml.
      - name: Licences (fuzz)
        run: cargo deny --manifest-path fuzz/Cargo.toml check licenses

  # Short fuzz of the getattrlistbulk buffer parser. Separate from `rust` so
  # it can use nightly without disturbing the stable pin. The longer run and
  # the Miri and ASAN jobs live in nightly.yml.
  fuzz:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins stable; the fuzz scripts ask for the nightly
      # named in scripts/nightly-toolchain with an explicit `+toolchain`.
      # Minimal profile: no docs, clippy or rustfmt.
      - name: Install pinned nightly
        run: rustup toolchain install "$(cat scripts/nightly-toolchain)" --profile minimal

      # install-action has no cargo-fuzz manifest, so build it once and cache.
      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo "+$(cat scripts/nightly-toolchain)" install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz parse::entries (60 s)
        run: scripts/fuzz-parser.sh 60

      # A crash leaves its reproducer in fuzz/artifacts; keep it.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
