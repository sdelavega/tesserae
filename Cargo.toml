[workspace]
resolver = "2"
members = [
    "crates/tesserae-cli",
    "crates/tesserae-core",
    "crates/tesserae-ffi",
    "crates/tesserae-testutil",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
