[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[licenses]
# Explicit allowlist: anything not listed here is rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.93

# libfuzzer-sys is "(MIT OR Apache-2.0) AND NCSA", so NCSA cannot be avoided.
# It is allowed for this one crate only, not globally: it is the fuzz
# harness's dependency (fuzz/ is outside the workspace and is never linked
# into or distributed with the product), and a global entry would quietly
# permit NCSA in a shipped dependency later. NCSA is permissive (MIT/X11 plus
# 3-clause BSD) and GPL-compatible. `fuzz/` is audited by its own invocation:
# `cargo deny --manifest-path fuzz/Cargo.toml check licenses`.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

# zstd's Rust safety layer and bundled C implementation are BSD-3-Clause.
# Keep this scoped to these two dependencies; the main allowlist stays narrow.
[[licenses.exceptions]]
crate = "zstd-safe"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
crate = "zstd-sys"
allow = ["BSD-3-Clause"]
