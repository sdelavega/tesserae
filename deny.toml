[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[licenses]
# Explicit allowlist: anything not listed here is rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "GPL-3.0",
]
confidence-threshold = 0.93

# Workspace crates are our own GPL-3.0-or-later code (publish = false);
# only third-party dependencies are held to the allowlist.
private = { ignore = true }
